<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Student and admin navigation flow</title><desc id="desc">Flow diagram showing the two role-based journeys from login.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61758b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#20364d}.node{fill:#fff;stroke:#99aec3;stroke-width:2}.student{fill:#eaf3ff;stroke:#70a5ed;stroke-width:2}.admin{fill:#e8f7ef;stroke:#72bd9c;stroke-width:2}.line{stroke:#61758b;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.label{fill:#60758b;font-size:14px}.title{font-size:28px;font-weight:700}</style><rect width="1200" height="690" fill="#f6f8fb"/><text x="58" y="58" class="title">SmartCampus navigation flow</text><text x="58" y="86" class="label">Role-based journeys planned for Day 2</text><rect x="480" y="120" width="240" height="68" rx="12" class="node"/><text x="538" y="162" font-size="19" font-weight="700">Login / Sign-up</text><path d="M600 188 V240 H295 V285" class="line"/><path d="M600 188 V240 H905 V285" class="line"/><text x="356" y="230" class="label">Student</text><text x="816" y="230" class="label">Admin</text><rect x="160" y="285" width="270" height="68" rx="12" class="student"/><text x="220" y="327" font-size="19" font-weight="700">Student dashboard</text><rect x="770" y="285" width="270" height="68" rx="12" class="admin"/><text x="842" y="327" font-size="19" font-weight="700">Admin dashboard</text><path d="M295 353 V405" class="line"/><path d="M905 353 V405 H810 V450" class="line"/><path d="M905 353 V405 H1000 V450" class="line"/><rect x="160" y="405" width="270" height="68" rx="12" class="student"/><text x="195" y="447" font-size="18" font-weight="700">Search / filter facilities</text><rect x="675" y="450" width="270" height="68" rx="12" class="admin"/><text x="717" y="492" font-size="18" font-weight="700">Review requests</text><rect x="970" y="450" width="180" height="68" rx="12" class="admin"/><text x="996" y="492" font-size="18" font-weight="700">Manage facilities</text><path d="M295 473 V525" class="line"/><path d="M810 518 V570" class="line"/><rect x="160" y="525" width="270" height="68" rx="12" class="student"/><text x="200" y="567" font-size="18" font-weight="700">Facility &amp; booking form</text><rect x="675" y="570" width="270" height="68" rx="12" class="admin"/><text x="716" y="612" font-size="18" font-weight="700">Approve / reject</text><path d="M430 559 H580 V620" class="line"/><rect x="445" y="620" width="270" height="54" rx="12" class="student"/><text x="491" y="654" font-size="17" font-weight="700">Submit / view bookings</text></svg>
