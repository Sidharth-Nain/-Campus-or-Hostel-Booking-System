<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Facility booking wireframe</title><desc id="desc">Facility information alongside a booking request form.</desc><style>text{font-family:Arial,sans-serif;fill:#20364d}.muted{fill:#63788e}.line{stroke:#bac8d5;stroke-width:2}.box{fill:#fff;stroke:#bac8d5;stroke-width:2}.blue{fill:#1769e0}.light{fill:#fff2d7}.white{fill:#fff}.green{fill:#16865b}</style><rect width="1200" height="720" fill="#f6f8fb"/><rect width="1200" height="67" fill="#fff"/><text x="62" y="43" font-size="22" font-weight="700">▣ SmartCampus</text><text x="70" y="112" font-size="15" fill="#1769e0">← Back to facilities</text><rect x="70" y="145" width="590" height="230" rx="14" class="light"/><text x="320" y="285" font-size="80" fill="#bc7611">◫</text><text x="70" y="420" font-size="13" fill="#1769e0">ACADEMIC</text><text x="70" y="462" font-size="34" font-weight="700">Seminar Hall A</text><text x="70" y="493" font-size="17" class="muted">A presentation-ready space for talks, workshops, and society events.</text><line x1="70" y1="535" x2="660" y2="535" class="line"/><text x="70" y="565" font-size="13" class="muted">LOCATION</text><text x="70" y="590" font-size="16" font-weight="700">Main Block, Floor 2</text><text x="310" y="565" font-size="13" class="muted">CAPACITY</text><text x="310" y="590" font-size="16" font-weight="700">80 people</text><text x="500" y="565" font-size="13" class="muted">FACILITIES</text><text x="500" y="590" font-size="16" font-weight="700">Projector · Wi-Fi</text><rect x="720" y="145" width="395" height="470" rx="12" class="box"/><text x="750" y="190" font-size="23" font-weight="700">Request a booking</text><text x="750" y="228" font-size="14">Date</text><rect x="750" y="238" width="335" height="42" rx="6" class="box"/><text x="765" y="265" font-size="14" class="muted">10 Nov 2026</text><text x="750" y="316" font-size="14">Start time</text><text x="928" y="316" font-size="14">End time</text><rect x="750" y="326" width="150" height="42" rx="6" class="box"/><rect x="928" y="326" width="157" height="42" rx="6" class="box"/><text x="765" y="353" font-size="14" class="muted">10:00</text><text x="943" y="353" font-size="14" class="muted">12:00</text><text x="750" y="399" font-size="14" class="green">● Slots shown available for planning only.</text><text x="750" y="440" font-size="14">Booking purpose</text><rect x="750" y="450" width="335" height="75" rx="6" class="box"/><text x="765" y="477" font-size="14" class="muted">Briefly describe your activity</text><rect x="750" y="550" width="335" height="45" rx="7" class="blue"/><text x="837" y="579" font-size="15" class="white" font-weight="700">Submit booking request</text></svg>
