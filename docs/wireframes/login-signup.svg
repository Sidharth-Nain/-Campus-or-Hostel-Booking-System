<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Login and sign-up wireframe</title><desc id="desc">Two-column authentication screen with account fields and an illustration area.</desc><style>text{font-family:Arial,sans-serif;fill:#20364d}.muted{fill:#63788e}.line{stroke:#bac8d5;stroke-width:2}.box{fill:#fff;stroke:#bac8d5;stroke-width:2}.blue{fill:#1769e0}.light{fill:#eaf3ff}.white{fill:#fff}</style><rect width="1200" height="720" fill="#f6f8fb"/><rect x="100" y="70" width="1000" height="580" rx="20" class="box"/><rect x="600" y="70" width="500" height="580" rx="0" fill="#1769e0"/><text x="160" y="135" font-size="18" class="muted">CAMPUS FACILITY BOOKING</text><text x="160" y="190" font-size="36" font-weight="700">Welcome to SmartCampus</text><text x="160" y="225" font-size="18" class="muted">Sign in to book spaces or create an account.</text><text x="160" y="285" font-size="18" font-weight="700" fill="#1769e0">Sign in</text><text x="260" y="285" font-size="18" class="muted">Create account</text><line x1="160" y1="302" x2="440" y2="302" class="line"/><line x1="160" y1="302" x2="220" y2="302" stroke="#1769e0" stroke-width="4"/><text x="160" y="340" font-size="15">College email</text><rect x="160" y="352" width="355" height="48" rx="7" class="box"/><text x="174" y="383" font-size="15" class="muted">you@campus.edu</text><text x="160" y="435" font-size="15">Password</text><rect x="160" y="447" width="355" height="48" rx="7" class="box"/><text x="174" y="478" font-size="18" class="muted">••••••••</text><rect x="160" y="530" width="355" height="50" rx="7" class="blue"/><text x="302" y="562" font-size="17" class="white" font-weight="700">Continue</text><rect x="664" y="190" width="62" height="62" rx="14" fill="#4e92ec"/><text x="683" y="231" font-size="30" class="white">▣</text><text x="664" y="335" font-size="35" class="white" font-weight="700">Find the right space</text><text x="664" y="378" font-size="35" class="white" font-weight="700">for your next idea.</text><text x="664" y="430" font-size="19" fill="#dcecff">Browse labs, halls, libraries and sports</text><text x="664" y="457" font-size="19" fill="#dcecff">facilities in one place.</text><text x="160" y="625" font-size="14" class="muted">Sign-up adds a full-name field; role is assigned securely.</text></svg>
