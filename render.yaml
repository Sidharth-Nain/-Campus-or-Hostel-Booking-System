services:
  - type: web
    name: campus-flow
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_DIST
        value: frontend/dist
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-flow-db
          property: connectionString

databases:
  - name: campus-flow-db
    plan: free
    region: singapore
    ipAllowList: []
